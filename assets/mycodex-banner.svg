<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">mycodex</title>
  <desc id="desc">mycodex: multi-account Codex for Linux hosts. Persistent accounts, one shared thread list, automatic account rotation through a local proxy, and phone remote control for the official Codex CLI. Python standard library only. By Manoj Verma (@manojvermamv).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a101d"/>
      <stop offset="1" stop-color="#101b2f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e2a40"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- card -->
  <rect x="0.5" y="0.5" width="1279" height="399" rx="24" fill="url(#bg)" stroke="#1f2b40"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="24" fill="url(#dots)" opacity="0.6"/>
  <rect x="64" y="56" width="132" height="4" rx="2" fill="url(#glow)"/>
  <text x="212" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#6b7a93">v0.2 · MIT</text>

  <!-- wordmark -->
  <text x="62" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="80" font-weight="700" fill="#e6edf3"><tspan fill="#22d3ee">&#x276F;</tspan> mycodex</text>
  <text x="64" y="198" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#9fb0c8">Multi-account Codex for Linux hosts</text>

  <!-- feature chips -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#d6e2f0">
    <rect x="64" y="226" width="214" height="36" rx="18" fill="#0f2233" stroke="#155e75"/>
    <circle cx="86" cy="244" r="5" fill="#22d3ee"/>
    <text x="100" y="250">persistent accounts</text>

    <rect x="290" y="226" width="236" height="36" rx="18" fill="#0f2233" stroke="#155e75"/>
    <circle cx="312" cy="244" r="5" fill="#22d3ee"/>
    <text x="326" y="250">one shared thread list</text>

    <rect x="64" y="274" width="196" height="36" rx="18" fill="#0f2a1e" stroke="#166534"/>
    <circle cx="86" cy="292" r="5" fill="#4ade80"/>
    <text x="100" y="298">automatic rotation</text>

    <rect x="272" y="274" width="226" height="36" rx="18" fill="#0f2a1e" stroke="#166534"/>
    <circle cx="294" cy="292" r="5" fill="#4ade80"/>
    <text x="308" y="298">phone remote control</text>
  </g>

  <!-- request path -->
  <text y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#6b7a93"><tspan x="64" fill="#e6edf3">codex</tspan><tspan x="128">&#x2192;</tspan><tspan x="154" fill="#22d3ee">mycodex proxy</tspan><tspan x="300">&#x2192;</tspan><tspan x="326" fill="#e6edf3">chatgpt.com</tspan></text>

  <!-- terminal window -->
  <g filter="url(#shadow)">
    <rect x="652" y="48" width="572" height="276" rx="14" fill="#0b1220" stroke="#22344f"/>
    <path d="M652 62 a14 14 0 0 1 14 -14 h544 a14 14 0 0 1 14 14 v20 h-572 z" fill="#131d30"/>
    <circle cx="676" cy="65" r="6" fill="#ff5f57"/>
    <circle cx="696" cy="65" r="6" fill="#febc2e"/>
    <circle cx="716" cy="65" r="6" fill="#28c840"/>
    <text x="938" y="70" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6b7a93">admin@ec2 ~/project</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5">
    <text x="672" y="108" fill="#9fb0c8"><tspan fill="#4ade80">$</tspan> mycodex quota</text>
    <!-- panel: header box joined to the body -->
    <rect x="672.5" y="118.5" width="532" height="106" rx="2" fill="none" stroke="#22d3ee"/>
    <line x1="672.5" y1="146.5" x2="1204.5" y2="146.5" stroke="#22d3ee"/>
    <text y="138"><tspan x="682" fill="#22d3ee" font-weight="700">Mycodex Quota</tspan><tspan x="826" fill="#9fb0c8">2/2 ready</tspan></text>
    <text y="167" fill="#9fb0c8" font-weight="700"><tspan x="682">PROFILE</tspan><tspan x="800">PLAN</tspan><tspan x="862">LEFT</tspan><tspan x="1126">READY</tspan></text>
    <text y="189"><tspan x="682" fill="#4ade80">* work</tspan><tspan x="800" fill="#22d3ee">plus</tspan><tspan x="862" fill="#e6edf3">5h 92% | weekly 71%</tspan><tspan x="1126" fill="#4ade80">yes</tspan></text>
    <text y="211"><tspan x="700" fill="#e6edf3">personal</tspan><tspan x="800" fill="#22d3ee">plus</tspan><tspan x="862" fill="#e6edf3">weekly 100%</tspan><tspan x="1126" fill="#4ade80">yes</tspan></text>
    <text x="672" y="256" fill="#9fb0c8"><tspan fill="#4ade80">$</tspan> mycodex rotation log -f</text>
    <text y="280" fill="#9fb0c8"><tspan x="688" fill="#fbbf24">paused</tspan><tspan x="776" fill="#e6edf3">work</tspan><tspan x="852">usage limit · until 14:56</tspan></text>
    <text y="304" fill="#9fb0c8"><tspan x="688" fill="#22d3ee">switch</tspan><tspan x="776" fill="#e6edf3">work &#x2192; personal</tspan><tspan x="940" fill="#4ade80">same thread</tspan></text>
  </g>

  <!-- author -->
  <text x="1224" y="360" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#6b7a93">by <tspan fill="#d6e2f0" font-weight="600">Manoj Verma</tspan> &#xB7; github.com/<tspan fill="#22d3ee">manojvermamv</tspan></text>
</svg>
